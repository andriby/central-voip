;=============================================
; RTP Configuration - PBX Remota
; Central VoIP Remota - Proyecto Comunicacion de Datos
;=============================================

[general]
; Rango de puertos UDP para flujo RTP (mapeado en docker-compose)
rtpstart=10101
rtpend=10200

; Deshabilitar ICE/STUN
icesupport=no
stunaddr=

; Validar origen RTP
strictrtp=yes
