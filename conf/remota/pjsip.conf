;=============================================
; PJSIP Configuration - PBX Remota
; Central VoIP Remota - Proyecto Comunicacion de Datos
;=============================================

;--- Transporte UDP ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5064
local_net=172.18.0.0/16
local_net=127.0.0.1/32

;--- Extension 2001: Usuario Remoto ---
[2001]
type=endpoint
context=internas-remota
disallow=all
allow=ulaw
allow=alaw
auth=auth-2001
aors=2001
callerid="Usuario Remoto" <2001>
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[auth-2001]
type=auth
auth_type=userpass
username=2001
password=nova2001

[2001]
type=aor
max_contacts=2
remove_existing=yes

;--- Troncal hacia PBX Principal ---
; PBX Principal esta en modo host en la maquina anfitriona (IP del bridge 172.18.0.1)
[troncal-principal]
type=endpoint
context=from-principal
disallow=all
allow=ulaw
allow=alaw
aors=troncal-principal
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
direct_media=no

[troncal-principal]
type=aor
contact=sip:172.18.0.1:5060
remove_existing=yes

[troncal-principal]
type=identify
endpoint=troncal-principal
match=172.18.0.1
