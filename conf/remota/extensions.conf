;=============================================
; Extensions Configuration - PBX Remota
; Central VoIP Remota - Proyecto Comunicacion de Datos
;=============================================

[general]
static=yes
writeprotect=no

;--- Contexto: Llamadas Internas Remotas ---
[internas-remota]
exten => 2001,1,Dial(PJSIP/2001,30,Tt)
 same => n,Hangup()

;--- Llamadas Salientes hacia PBX Principal ---
; Prefijo 9 + extension principal (ej: 91001, 91002)
[saliente-principal]
exten => _91XXX,1,NoOp(Llamada hacia PBX Principal: ${EXTEN:1})
 same => n,Dial(PJSIP/${EXTEN:1}@troncal-principal,30)
 same => n,Hangup()

;--- Llamadas Entrantes desde PBX Principal ---
; PBX Principal envia numeros 2XXX (extensiones remotas)
[from-principal]
exten => _2XXX,1,NoOp(Llamada entrante desde PBX Principal: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()
