;=============================================
; RTP Configuration - NovaLink C.A.
; Central VoIP - Proyecto Comunicacion de Datos
;=============================================

[general]
; Rango de puertos UDP para flujo RTP
; Debe coincidir con los puertos abiertos en firewall y disponibles en el host
rtpstart=10000
rtpend=10100

; Deshabilitar ICE/STUN; usamos red propia (ZeroTier) sin NAT traversal externo
icesupport=no
stunaddr=

; Validar que el RTP provenga de la IP/PUERTO negociados en SDP (seguridad)
strictrtp=yes

; Tiempo de espera para paquetes RTP perdidos (ms)
; rtcpinterval=5000
