[general]

[default_bridge]
type=bridge
max_members=10
record_conference=no

[default_user]
type=user
admin=no
marked=no
startmuted=no
music_on_hold_when_empty=yes
quiet=no

[admin_user]
type=user
admin=yes
marked=yes
startmuted=no
quiet=no
