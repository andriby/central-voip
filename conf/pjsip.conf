;--- Troncal SIP hacia PBX Remota ---
; PBX Remota corre en contenedor Docker bridge con IP estatica 172.31.254.50:5064
[troncal-remota]
type=endpoint
context=from-trunk
disallow=all
allow=ulaw
allow=alaw
aors=troncal-remota
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid="Troncal Remota" <0>

[troncal-remota]
type=aor
max_contacts=1
contact=sip:172.31.254.50:5064
remove_existing=yes

[troncal-remota]
type=identify
endpoint=troncal-remota
match=172.31.254.50
