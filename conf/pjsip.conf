;=============================================
; PJSIP Configuration - NovaLink C.A.
; Central VoIP - Proyecto Comunicacion de Datos
;=============================================

;--- Transporte UDP ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
external_signaling_address=__HOST_IP__
external_media_address=__HOST_IP__
local_net=127.0.0.1/32
local_net=__LOCAL_NET__

;--- Transporte TCP ---
[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060
external_signaling_address=__HOST_IP__
external_media_address=__HOST_IP__
local_net=127.0.0.1/32
local_net=__LOCAL_NET__

;--- Transporte TLS ---
[transport-tls]
type=transport
protocol=tls
bind=0.0.0.0:5061
external_signaling_address=__HOST_IP__
external_media_address=__HOST_IP__
local_net=127.0.0.1/32
local_net=__LOCAL_NET__
cert_file=/etc/asterisk/certs/asterisk.crt
priv_key_file=/etc/asterisk/certs/asterisk.key
method=tlsv1_2

;--- Extension 1001: Adrian Campos ---
[1001]
type=endpoint
context=internas
disallow=all
allow=ulaw
allow=alaw
allow=g729
auth=auth-1001
aors=1001
callerid="Adrian Campos" <1001>
;transport=transport-tls
media_encryption=sdes
suppress_moh_on_sendonly=yes
; Call Hold: timeout de 15 minutos (produccion)
rtp_timeout_hold=900
; NAT settings para ZeroTier
rtp_symmetric=yes
rewrite_contact=yes
force_rport=yes
direct_media=no

[auth-1001]
type=auth
auth_type=userpass
username=1001
password=nova1001

[1001]
type=aor
max_contacts=1

