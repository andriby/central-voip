;=============================================
; Voicemail Configuration - NovaLink C.A.
; Central VoIP - Proyecto Comunicacion de Datos
;=============================================

[general]
; Formato de grabacion (wav49 = GSM en WAV, gsm, wav)
format=wav49|gsm|wav

; Remitente de notificaciones por correo
serveremail=asterisk@novalink.local

; Adjuntar mensaje en notificacion
attach=yes

; Maximo de mensajes por buzon
maxmsg=100

; Duracion maxima/minima de mensajes (segundos)
maxsecs=180
minsecs=3

; Duracion maxima del saludo personal
maxgreet=60

; Zonas horarias para los mensajes de voz
[zonemessages]
eastern=America/Caracas|'vm-received' Q 'digits/at' IMp

;--- Buzones de voz por defecto ---
[default]
; extension => pin,nombre,correo[,opciones[,outcid[,pagergroup[,callback]]]]
1001 => 1234,Adrian Campos,adrian@novalink.local
1002 => 1234,Aaron Contreras,aaron@novalink.local
